<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .bar { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .border { fill: none; stroke: #30363d; stroke-width: 1.5; rx: 10; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .prompt { fill: #3fb950; font-weight: 700; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .hdr { fill: #58a6ff; font-weight: 700; }
      .txt { fill: #c9d1d9; }
      .muted { fill: #8b949e; }
      .warn { fill: #d29922; font-weight: 600; }
      .danger { fill: #f85149; font-weight: 600; }
      .ok { fill: #3fb950; font-weight: 600; }
      .divider { stroke: #21262d; stroke-width: 1; }
    </style>
  </defs>

  <!-- Terminal Frame -->
  <rect width="960" height="570" rx="10" class="bg" />
  <path d="M 0 10 Q 0 0 10 0 L 950 0 Q 960 0 960 10 L 960 36 L 0 36 Z" class="bar" />
  <circle cx="22" cy="18" r="6" fill="#ff5f56" />
  <circle cx="42" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="18" r="6" fill="#27c93f" />
  <text x="480" y="22" class="title">lantern — TCP/UDP Socket Exposure, Causality &amp; Safe Compose Remediation</text>
  <rect x="0.75" y="0.75" width="958.5" height="568.5" rx="10" class="border" />

  <!-- Step 1: lantern scan -->
  <text x="24" y="66" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">lantern scan</tspan></text>
  <text x="24" y="92" class="mono hdr" xml:space="preserve">PORT     PROTO    ADDRESS         PROCESS         CONTAINER    REACHABILITY</text>
  <text x="24" y="114" class="mono" xml:space="preserve"><tspan class="txt">5432     TCP      </tspan><tspan class="danger">0.0.0.0</tspan><tspan class="txt">         docker-proxy    postgres     </tspan><tspan class="warn">LAN reachable</tspan></text>
  <text x="24" y="134" class="mono" xml:space="preserve"><tspan class="txt">5353     UDP      </tspan><tspan class="danger">0.0.0.0</tspan><tspan class="txt">         avahi-daemon    -            </tspan><tspan class="warn">LAN reachable</tspan></text>
  <text x="24" y="154" class="mono" xml:space="preserve"><tspan class="txt">6379     TCP      </tspan><tspan class="ok">127.0.0.1</tspan><tspan class="txt">       docker-proxy    redis        </tspan><tspan class="ok">localhost only</tspan></text>

  <line x1="24" y1="174" x2="936" y2="174" class="divider" />

  <!-- Step 2: lantern why 5432 -->
  <text x="24" y="200" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">lantern why 5432</tspan></text>
  <text x="24" y="224" class="mono cmd">postgres :5432</text>

  <text x="24" y="252" class="mono hdr">EXPOSURE PATH</text>
  <text x="24" y="274" class="mono txt">  docker-compose.yml -&gt; <tspan class="warn">5432:5432</tspan> -&gt; Docker: postgres -&gt; <tspan class="danger">0.0.0.0:5432</tspan> -&gt; eth0 (192.168.1.50) -&gt; <tspan class="warn">LAN reachable</tspan></text>

  <text x="24" y="304" class="mono hdr">ROOT CAUSE</text>
  <text x="24" y="324" class="mono muted" xml:space="preserve">  /home/user/app/docker-compose.yml:6</text>
  <text x="24" y="344" class="mono warn" xml:space="preserve">      - "5432:5432"</text>

  <text x="24" y="374" class="mono hdr">RECOMMENDED CHANGE</text>
  <text x="24" y="394" class="mono ok" xml:space="preserve">      - "127.0.0.1:5432:5432"</text>

  <line x1="24" y1="414" x2="936" y2="414" class="divider" />

  <!-- Step 3: lantern fix unified diff -->
  <text x="24" y="440" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">lantern fix 5432 --diff</tspan></text>
  <text x="24" y="464" class="mono muted" xml:space="preserve">  --- a/docker-compose.yml</text>
  <text x="24" y="482" class="mono muted" xml:space="preserve">  +++ b/docker-compose.yml</text>
  <text x="24" y="500" class="mono hdr" xml:space="preserve">  @@ -4,3 +4,3 @@</text>
  <text x="24" y="520" class="mono danger" xml:space="preserve">  -      - "5432:5432"</text>
  <text x="24" y="540" class="mono ok" xml:space="preserve">  +      - "127.0.0.1:5432:5432"</text>
</svg>
