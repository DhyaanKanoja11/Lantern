name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Pre-Release Verification (Tests)
        run: go test -count=1 ./...

      - name: Pre-Release Verification (Race Detector)
        run: go test -race -count=1 ./...

      - name: Pre-Release Verification (Static Analysis)
        run: go vet ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync Package Manager Manifests (Homebrew & Scoop)
        run: |
          python scripts/sync_packaging.py \
            --version "${{ github.ref_name }}" \
            --checksums dist/checksums.txt \
            --token "${{ secrets.RELEASE_PAT }}"
