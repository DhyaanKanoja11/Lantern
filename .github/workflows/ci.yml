name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  lint-and-hygiene:
    name: Code Hygiene & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -s -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::The following Go files are not formatted properly according to gofmt:"
            echo "$UNFORMATTED"
            echo "Please run: gofmt -s -w ."
            exit 1
          fi
          echo "gofmt verification passed."

      - name: Verify Go Module Tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod or go.sum is not tidy. Run 'go mod tidy' and commit changes."
            exit 1
          fi
          echo "go mod tidy verification passed."

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    needs: lint-and-hygiene
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: full race detector & coverage across Go 1.22 & 1.23
          - os: ubuntu-latest
            go-version: '1.22'
            race: true
          - os: ubuntu-latest
            go-version: '1.23'
            race: true
          # macOS: Apple Silicon runner on Go 1.23 (Go 1.22 has known Mach-O LC_UUID bug with -race on macOS 14)
          - os: macos-latest
            go-version: '1.23'
            race: true
          # Windows: native Windows test & binary compilation across Go 1.22 & 1.23
          - os: windows-latest
            go-version: '1.22'
            race: false
          - os: windows-latest
            go-version: '1.23'
            race: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Run Tests
        run: |
          if [ "${{ matrix.race }}" = "true" ]; then
            go test -v -race -coverprofile=coverage.out ./...
          else
            go test -v ./...
          fi

      - name: Run Static Analysis (go vet)
        run: go vet ./...

      - name: Build Binary
        run: go build ./cmd/lantern

      - name: Verify CLI Basic Invariants
        run: |
          ./lantern version
          ./lantern doctor || true
          ./lantern fix --help
          ./lantern scan --help
